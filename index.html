<!doctype html>
<html lang="ar" dir="rtl">
<head>

  <title>Nour Atelier | أتيليه نور</title>
  <style>
    :root{--gold:#b18a45;--gold-dark:#8d6a2f;--ink:#302b24;--muted:#827b70;--paper:#fbf9f4;--line:#e9e0d1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#fff 0%,var(--paper) 62%);color:var(--ink);font-family:Tahoma,Arial,sans-serif;display:flex;justify-content:center;padding:28px 16px}
    .wrap{width:100%;max-width:440px}
    .card{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:26px;padding:30px 22px 22px;box-shadow:0 16px 50px rgba(70,50,20,.07);text-align:center}
    .mark{width:78px;height:78px;border:1px solid var(--gold);border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-size:29px;letter-spacing:1px}
    h1{font-family:Georgia,serif;font-weight:500;letter-spacing:1px;color:var(--gold-dark);font-size:31px;margin:4px 0}
    .arabic{font-size:21px;margin:3px 0 9px;font-weight:600}
    .tag{font-size:13px;color:var(--muted);margin:0 0 24px}
    .links{display:grid;gap:11px}
    .link{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;font-size:15px;transition:.18s}
    .link:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 5px 18px rgba(177,138,69,.10)}
    .link.primary{background:linear-gradient(135deg,#c5a56d,#a77e3b);color:white;border-color:transparent;font-weight:700}
    .ico{width:21px;height:21px;display:inline-grid;place-items:center;color:var(--gold-dark);font-size:16px}
    .primary .ico{color:white}
    .address{margin:22px 0 0;padding:17px 13px 4px;border-top:1px solid var(--line);line-height:1.9;font-size:13px;color:var(--muted)}
    .address strong{display:block;color:var(--gold-dark);font-size:15px;margin-bottom:3px}
    .footer{font-size:11px;color:#a39a8b;margin-top:20px}
    @media(prefers-reduced-motion:reduce){.link{transition:none}}
  </style>
</head>
<body>

        <a class="link" href="https://www.tiktok.com/@norhanahmed49" target="_blank" rel="noopener"><span class="ico">♪</span> TikTok</a>
        <a class="link" href="https://maps.google.com/?q=30.010279,31.152134" target="_blank" rel="noopener"><span class="ico">⌖</span> موقعنا على الخريطة</a>
